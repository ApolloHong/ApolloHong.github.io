<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // set the theme before first paint: saved choice, else the OS preference
  (function () {
    var t;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}Lizhan Hong (Apollo, 洪历展) — applied mathematics at École Polytechnique. Quantitative research, stochastic modelling and machine learning.{% endif %}">
<meta name="theme-color" content="#07090d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)">
<link rel="canonical" href="{{ site.url }}{{ page.url | remove: 'index.html' }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
<meta property="og:url" content="{{ site.url }}{{ page.url | remove: 'index.html' }}">
