  <section class="schools" aria-label="Education">
    {% include skyline.svg %}
    <div class="wrap schools-grid">
      <figure class="coin" data-coin>
        <div class="coin-stage">
          <span class="orbit" aria-hidden="true"></span>
          <button class="coin-3d" type="button" title="Click to flip" aria-label="Shanghai Jiao Tong University; flip for details">
            <span class="edge" aria-hidden="true"></span>
            <span class="face front"><span class="emblem" style="--mask:url(/images/emblems/sjtu.png)"></span><span class="glare"></span></span>
            <span class="face back"><span class="back-txt"><b>B.Sc.</b> Computer Science<br><b>GPA</b> 4.19 / 4.3<br><b>M.S.</b> 2026–28</span><span class="glare"></span></span>
          </button>
        </div>
        <figcaption><b>Shanghai Jiao Tong University</b><span>Computer Science · 2022–28</span></figcaption>
      </figure>

      <div class="seam" aria-hidden="true"><span>Dual degree</span></div>

      <figure class="coin" data-coin>
        <div class="coin-stage">
          <span class="orbit" aria-hidden="true"></span>
          <button class="coin-3d" type="button" title="Click to flip" aria-label="École Polytechnique; flip for details">
            <span class="edge" aria-hidden="true"></span>
            <span class="face front"><span class="emblem tall" style="--mask:url(/images/emblems/polytechnique.svg)"></span><span class="glare"></span></span>
            <span class="face back"><span class="back-txt"><b>Ingénieur</b><br>Applied Mathematics<br><b>MathsFI</b> · Prof. H. Pham</span><span class="glare"></span></span>
          </button>
        </div>
        <figcaption><b>École Polytechnique</b><span>Applied Mathematics · 2025–27</span></figcaption>
      </figure>
    </div>
  </section>
